<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Brand Gradient -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)" />

  <!-- Subtle Inner Border / Ring for Polish -->
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="white" stroke-opacity="0.15" stroke-width="8" fill="none" />

  <!-- Dynamic Flow Curves (Creator Stream) -->
  <path d="M 96 384 C 180 340, 260 420, 416 350" stroke="white" stroke-opacity="0.2" stroke-width="12" stroke-linecap="round" fill="none" />
  <path d="M 120 420 C 220 380, 300 460, 420 400" stroke="white" stroke-opacity="0.1" stroke-width="8" stroke-linecap="round" fill="none" />

  <!-- YouTube Play Arrow Centerpiece -->
  <path d="M 192 168 C 192 154 207 146 219 153 L 344 233 C 356 240 356 258 344 265 L 219 345 C 207 352 192 344 192 330 Z" fill="white" filter="url(#glow)" />

  <!-- AI Sparkle Star (Top Right of Play Triangle) -->
  <path d="M 372 130 C 372 152 388 168 410 168 C 388 168 372 184 372 206 C 372 184 356 168 334 168 C 356 168 372 152 372 130 Z" fill="#FACC15" />
  <circle cx="372" cy="168" r="4" fill="white" />

  <!-- Secondary AI Sparkle (Bottom Left Accent) -->
  <path d="M 136 180 C 136 192 144 200 156 200 C 144 200 136 208 136 220 C 136 208 128 200 116 200 C 128 200 136 192 136 180 Z" fill="#A7F3D0" />
</svg>
